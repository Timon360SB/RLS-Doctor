<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">RLS Doctor — offline contract check</title><desc id="desc">Selected output from an actual local SDK to Python event validation. No live Supabase or database replay is shown.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#D9F3E7"/><stop offset=".52" stop-color="#EDF4EF"/><stop offset="1" stop-color="#F2E2D0"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#182731"/><stop offset="1" stop-color="#101B25"/></linearGradient></defs><rect width="1280" height="720" rx="28" fill="url(#bg)"/><circle cx="1130" cy="70" r="230" fill="#F9DCC0" opacity=".4"/><circle cx="90" cy="660" r="270" fill="#A7DDC6" opacity=".26"/><rect x="72" y="72" width="1136" height="552" rx="24" fill="#173B31" opacity=".1"/><rect x="80" y="60" width="1120" height="552" rx="20" fill="url(#panel)"/><rect x="80.5" y="60.5" width="1119" height="551" rx="19.5" fill="none" stroke="#345047"/><path d="M81 125h1118" stroke="#31454E"/><circle cx="111" cy="92" r="6" fill="#F89185"/><circle cx="133" cy="92" r="6" fill="#F2CB79"/><circle cx="155" cy="92" r="6" fill="#6ADCB1"/><text x="184" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#E3ECE8">rls-doctor</text><text x="1162" y="98" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#9BB8AD">OFFLINE CONTRACT CHECK</text><text x="126" y="187" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="20" fill="#72DDB0">$ node examples/node-basic/capture-event.mjs &gt; event.json</text><text x="126" y="233" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="20" fill="#72DDB0">$ uv run --project python rls-doctor validate event.json --format json</text><text x="126" y="300" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#DCE5EC">{</text><text x="126" y="336" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#7EE5B7">  &quot;result&quot;: &quot;PASS&quot;,</text><text x="126" y="372" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#DCE5EC">  &quot;schema_version&quot;: &quot;1.0&quot;,</text><text x="126" y="408" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#DCE5EC">  &quot;resource&quot;: &quot;documents&quot;,</text><text x="126" y="444" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#7EE5B7">  &quot;checks&quot;: [{ &quot;check&quot;: &quot;event_contract&quot;, &quot;result&quot;: &quot;PASS&quot; }]</text><text x="126" y="480" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" fill="#DCE5EC">}</text><path d="M126 535h1028" stroke="#2A4049"/><circle cx="133" cy="568" r="4" fill="#69DBAA"/><text x="149" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#AFC5BD">Selected fields from an actual local run. No database or network replay.</text><text x="80" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#244338">Capture the request. Keep the evidence.</text><text x="1200" y="668" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.8" fill="#557466">RLS DOCTOR / DEVELOPER PREVIEW</text></svg>