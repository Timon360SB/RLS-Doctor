name: Checks and local integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project python --frozen --group dev
      - name: TypeScript build, types, lint and tests
        run: |
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Python formatting and lint
        run: |
          uv run --project python ruff format --check python scripts
          uv run --project python ruff check python scripts
      - name: Python strict type check
        working-directory: python
        run: uv run mypy
      - name: Python unit, security and shared-contract tests
        run: uv run --project python pytest python/tests -m 'not integration'
      - name: Build, audit and execute installed Python and SDK distributions
        id: packages
        # Only the audited package directory is eligible for the next step.
        run: uv run --project python python scripts/package_check.py --github-output
      - name: Retain audited preview packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preview-${{ github.sha }}-node-${{ matrix.node }}-py-${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.packages.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
          # The explicit directory has exactly 3 packages + checksums/manifest.
          include-hidden-files: true

  windows-unit:
    name: Windows Node 22 / Python 3.13
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install locked dependencies and build SDK
        run: |
          pnpm install --frozen-lockfile
          uv sync --project python --frozen --group dev
          pnpm build
      - name: Parse Windows launchers
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/demo.ps1'), [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count) { throw 'Windows launcher syntax check failed' }
      - name: Python unit, privacy, shared contract and process-lock tests
        run: uv run --project python pytest python/tests -m 'not integration'

  local-integration:
    name: Actual local Supabase and PostgreSQL
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RLS_DOCTOR_ALLOW_FIXTURE_SETUP: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: "2.121.0"
      - name: Install locked dependencies and build
        run: |
          pnpm install --frozen-lockfile
          uv sync --project python --frozen --group dev
          pnpm build
      - name: Start disposable local fixtures
        # Startup may print local credentials. Never save or emit that output.
        run: |
          if ! supabase start --workdir fixtures >/dev/null 2>&1; then
            echo "Local fixture startup failed; raw logs suppressed because they may contain credentials."
            exit 1
          fi
      - name: Real database integration and Auth/REST end-to-end checks
        # Status secrets travel through stdin only; no secret-bearing status file.
        run: |
          supabase status --workdir fixtures --output json 2>/dev/null |
            uv run --project python python scripts/e2e.py --status-stdin
      - name: Existing database TLS, least-privilege and bound Auth capture
        run: uv run --project python python scripts/database_check.py --workdir fixtures
      - name: Managed session JSON contract and exit codes
        # The checker retains local status in memory; raw logs/keys are never emitted.
        run: uv run --project python python scripts/session_check.py --workdir fixtures
      - name: Separate task-board app with installed SDK and CLI
        run: uv run --project python python scripts/task_board_check.py --check
      - name: Stop separate sample app
        if: always()
        run: |
          if [ -f .rls-doctor/task-board/supabase/config.toml ]; then
            uv run --project python python scripts/task_board_check.py --stop
          fi
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --workdir fixtures >/dev/null 2>&1


  postgres-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} catalog and RLS behavior
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
      - name: Install locked Python test dependencies
        run: uv sync --project python --frozen --group dev
      - name: Test actual PostgreSQL with scoped container cleanup
        run: uv run --project python python scripts/postgres_matrix.py --versions ${{ matrix.postgres }}
